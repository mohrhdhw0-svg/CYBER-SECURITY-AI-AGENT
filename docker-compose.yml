services:
  security-engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: cyber-agent-engine
    restart: unless-stopped
    env_file:
      - ./engine/.env
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
