name: Security platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install
      - name: Build Next.js application
        run: npm run build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate engine and deployment script syntax
        run: |
          python -m compileall -q engine
          bash -n engine/cloudrun/deploy.sh
      - name: Test engine authorization guards
        working-directory: engine
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
