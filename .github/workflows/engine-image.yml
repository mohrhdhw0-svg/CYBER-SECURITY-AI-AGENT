name: Build and publish isolated scanner engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cyber-security-ai-agent-engine:latest
            ghcr.io/${{ github.repository_owner }}/cyber-security-ai-agent-engine:${{ github.sha }}
