name: Cyber AI branch validation

on:
  push:
    branches:
      - feature/cyber-ai-assistant

permissions:
  contents: read

concurrency:
  group: cyber-ai-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js application
        run: npm run build

  engine-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine dependencies
        working-directory: engine
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run engine security tests
        working-directory: engine
        run: python -m unittest discover -s tests -v
